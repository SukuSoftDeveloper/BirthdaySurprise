<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎁 Something Special Awaits...</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-page1">

  <div id="particles-js"></div>
  <div class="hearts-container"></div>
  <div class="page-progress"></div>

  <div class="page-wrapper">
    <div class="text-center" id="intro-content">
      <p class="subtitle mb-3" data-aos="fade-down" data-aos-delay="200">
        ✨ A special surprise just for you ✨
      </p>

      <h1 class="display-title text-glow mb-4" data-aos="zoom-in" data-aos-delay="400">
        Hey Bestie! 💖
      </h1>

      <p class="subtitle mb-5" data-aos="fade-up" data-aos-delay="600">
        Someone made something special for your birthday...
      </p>

      <div class="gift-box" id="gift-box" data-aos="bounce-in" data-aos-delay="800">
        <div class="gift-bow">🎀</div>
        <div class="gift-lid"></div>
        <div class="gift-body">
          <div class="gift-ribbon-v"></div>
          <div class="gift-ribbon-h"></div>
        </div>
      </div>

      <p class="subtitle mt-4 mb-4" data-aos="fade-up" data-aos-delay="1000">
        <i class="fas fa-hand-pointer"></i> Tap the gift to unwrap your surprise!
      </p>

      <button class="btn-magic d-none" id="start-btn" data-aos="fade-up">
        Open Your Surprise 🎉
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/page1.js"></script>
</body>
</html>
